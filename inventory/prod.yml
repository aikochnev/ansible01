all:
  children:
    el:
      hosts:
        centos7:
          ansible_host: 127.0.0.1
          ansible_port: 2022
          ansible_user: root
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ansible_ssh_private_key_file: /home/andrey/.ssh/ubuntu
    deb:
      hosts:
        ubuntu:
          ansible_host: 127.0.0.1
          ansible_port: 2023
          ansible_user: root
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ansible_ssh_private_key_file: /home/andrey/.ssh/ubuntu
    local:
      hosts:
        localhost:
          ansible_connection: local
